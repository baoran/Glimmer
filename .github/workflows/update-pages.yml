name: Update private market snapshot

on:
  schedule:
    # 16:10 Asia/Shanghai every day (GitHub cron uses UTC).
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch the latest A-share snapshot
        run: node scripts/update-pages-data.mjs

      - name: Commit the daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/data
          git diff --cached --quiet || git commit -m "data: update daily A-share snapshot"
          git push
